<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1118">
<title>梯度下降 · 学习率决定一切</title>
<meta name="description" content="可交互的梯度下降讲解：梯度指向上坡，所以下降要取反；学习率越过 2/L 就开始震荡、然后发散。">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0b1118;
    color: #edf1f4;
    font-family: "Satoshi", "Source Han Sans SC", "PingFang SC", system-ui, sans-serif;
    overflow: hidden;
  }

  #experience {
    position: relative;
    width: 100%;
    height: 100dvh;
    min-height: 560px;
    overflow: hidden;
    isolation: isolate;
  }

  #stage { position: absolute; inset: 0; z-index: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #markers {
    position: absolute; inset: 0; z-index: 5;
    pointer-events: none;
  }

  /* ── 顶部控件 ── */
  #controls {
    position: absolute; z-index: 10;
    top: 16px; left: 16px;
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }

  .brand {
    font-size: 13px; letter-spacing: 0.06em;
    color: #99a9b6;
    padding: 6px 12px;
    border: 1px solid rgba(197,212,223,0.16);
    border-radius: 8px;
    background: rgba(18,28,37,0.9);
  }
  .brand strong { color: #edf1f4; font-weight: 600; }

  /* ── 右侧面板 ── */
  #panel {
    position: absolute; z-index: 10;
    top: 16px; right: 16px;
    width: 280px;
    max-height: calc(100dvh - 220px);
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 14px;
  }

  #narrative {
    background: rgba(18,28,37,0.95);
    border: 1px solid rgba(197,212,223,0.16);
    border-radius: 10px;
    padding: 14px 16px;
    backdrop-filter: blur(12px);
  }

  /* 损失曲线小图：左下角 HUD，避开工具栏与时间轴 */
  .gd-chart {
    position: absolute; z-index: 9; left: 20px; bottom: 152px;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 6px 22px rgba(0,0,0,.45);
    pointer-events: none;
  }
  @media (max-width: 820px) { .gd-chart { display: none; } }

  #force-readout {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap;
  }

  /* ── 底部时间轴 ── */
  #timeline-host {
    position: absolute; z-index: 10;
    left: 16px; right: 312px; bottom: 16px;
  }

  /* ── 加载 / 错误 ── */
  #loader {
    position: absolute; inset: 0; z-index: 20;
    display: grid; place-items: center;
    background: #0b1118;
    transition: opacity 0.4s ease;
  }
  #loader.is-ready { opacity: 0; pointer-events: none; }
  #loader p { font-size: 13px; color: #99a9b6; letter-spacing: 0.1em; }

  #render-error {
    position: absolute; z-index: 30;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(18,28,37,0.98);
    border: 1px solid rgba(197,212,223,0.2);
    border-radius: 12px;
    padding: 24px 28px;
    max-width: 420px;
    text-align: center;
  }
  #render-error h2 { font-size: 17px; margin-bottom: 8px; }
  #render-error p { font-size: 14px; color: #c0cbd3; line-height: 1.6; }

  /* ── 窄屏 ── */
  @media (max-width: 800px) {
    #panel {
      top: auto; bottom: 96px; left: 16px; right: 16px;
      width: auto; max-height: 34dvh;
    }
    #timeline-host { left: 16px; right: 16px; bottom: 12px; }
    #controls { top: 12px; left: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #loader { transition: none; }
  }
